<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>MEDIA PEMBELAJARAN MANIPULATIF MATERI PERPANGKATAN</h1>
    <h2>Alat Peraga Digital Sifat Eksponen "PANGKATOPIA"</h2>
    <br>

    <h2>Sifat Eksponen</h2>
    <select name="menu1" id="menu1" onchange="tampilkanRumus()">
        <option value="" disabled selected>-- Pilih Sifat Eksponen --</option>
        <option value="perkalian">Perkalian Pangkat</option>
        <option value="pembagian">Pembagian Pangkat</option>
        <option value="pangkat-pangkat">Pangkat dari Pangkat</option>
        <option value="perkalian-dalam">Perkalian dalam Pangkat</option>
        <option value="pembagian-dalam">Pembagian dalam Pangkat</option>
        <option value="nol">Pangkat Nol</option>
        <option value="negatif">Pangkat Negatif</option>
        <option value="campuran">Operasi Campuran</option>
    </select>
    <br>

    <h2>Rumus</h2>
    <div class="rumus-box" id="rumus-box">
        <div class="rumus-judul" id="rumus-judul"></div>
        <div class="rumus-utama" id="rumus-utama"></div>
        <div class="rumus-syarat" id="rumus-syarat"></div>
    </div>
    <p id="rumus-placeholder" style="color:#000; font-size:14px;">-</p>
    <br>

    <h2>Pilih Warna</h2>
    <div class="dropdown" id="dd">
        <div class="dd-btn" id="dd-btn" onclick="toggleDD()">
            <div class="dd-left">
                <span class="dot" id="btn-dot" style="background:#ccc"></span>
                <span id="dd-label">-- Pilih Warna --</span>
            </div>
            <span>▼</span>
        </div>
        <div class="dd-list" id="dd-list">
            <div class="dd-item" onclick="pilih(this,'Merah','#E24B4A')">
                <span class="dot" style="background:#E24B4A"></span> Merah
            </div>
            <div class="dd-item" onclick="pilih(this,'Biru','#378ADD')">
                <span class="dot" style="background:#378ADD"></span> Biru
            </div>
            <div class="dd-item" onclick="pilih(this,'Hijau','#639922')">
                <span class="dot" style="background:#639922"></span> Hijau
            </div>
            <div class="dd-item" onclick="pilih(this,'Kuning','#EF9F27')">
                <span class="dot" style="background:#EF9F27"></span> Kuning
            </div>
            <div class="dd-item" onclick="pilih(this,'Ungu','#7F77DD')">
                <span class="dot" style="background:#7F77DD"></span> Ungu
            </div>
        </div>
    </div>
    <br>
    <button onclick="mulai()" id="tombol-mulai">▶ Mulai</button>

    <div id="area-soal">
        <div class="soal-badge" id="soal-badge"></div>
        <div class="soal-teks" id="soal-teks"></div>
        <div id="area-kotak"></div>
        <p class="petunjuk">Klik kotak untuk mengisi (lingkaran muncul) atau mengosongkan kembali</p>
        <br>
        <button class="btn-cek" onclick="cekJawaban()">Cek Jawaban</button>
        <button class="btn-batal" onclick="batalKotak()">Batal</button>
        <div class="hasil-cek" id="hasil-cek"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
